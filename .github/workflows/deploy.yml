name: Verify and deploy

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this tested dev commit to production
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ENV_FILE: /tmp/aeterna-ci.env.example
      COMPOSE_PROJECT_NAME: aeterna-control-plane
      BACKEND_IMAGE: aeterna-control-plane-backend
      FRONTEND_IMAGE: aeterna-control-plane-frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          platforms: linux/amd64
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Prepare frontend verification image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          target: builder
          platforms: linux/amd64
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:dev
          cache-from: type=gha,scope=frontend
      - name: Prepare isolated development configuration
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          cp .env.example "$ENV_FILE"
          {
            printf '\nENV=development\n'
            for name in AETERNA_PII_KEY_V1 AETERNA_LOOKUP_KEY_V1 AETERNA_OTP_KEY_V1; do
              printf '%s=' "$name"
              openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n'
              printf '\n'
            done
          } >> "$ENV_FILE"
          docker tag "$BACKEND_IMAGE:$RELEASE_SHA" "$BACKEND_IMAGE:dev"
      - name: Start development services from built images
        run: AETERNA_SKIP_BUILD=1 ./deploy.sh dev
      - name: Verify identity initializer command handling
        run: |
          IMAGE_TAG=dev docker compose --env-file "$ENV_FILE" -f docker-compose.yml \
            --profile identity-setup run --rm --no-deps identity-setup --help
      - name: Verify backend against PostgreSQL and Redis
        run: |
          docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.dev.yml \
            exec -T backend flake8 app scripts tests --select=E9,F63,F7,F82
          docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.dev.yml \
            exec -T backend pytest -q tests
      - name: Verify frontend
        run: |
          docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.dev.yml \
            exec -T frontend pnpm type-check
          docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.dev.yml \
            exec -T frontend pnpm lint
      - name: Verify release orchestration
        run: |
          bash -n deploy.sh deployment/ssh-release.sh deployment/bootstrap.sh deployment/configure-ingress.sh
          bash tests/deployment/test_release.sh
      - name: Package tested production images
        if: github.event_name != 'pull_request'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p release-bundle
          docker save "$BACKEND_IMAGE:$RELEASE_SHA" "$FRONTEND_IMAGE:$RELEASE_SHA" \
            | gzip -1 > release-bundle/images.tar.gz
          tar -czf release-bundle/release.tar.gz deploy.sh docker-compose.yml \
            docker-compose.prod.yml docker-compose.aws.yml docker-compose.small.yml \
            docker-compose.release.yml
          cd release-bundle
          sha256sum images.tar.gz release.tar.gz > checksums.txt
      - name: Upload production release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-${{ github.sha }}
          path: release-bundle/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Stop development services
        if: always()
        run: ./deploy.sh stop

  deploy:
    needs: verify-build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://console.aeternarelay.com
    concurrency:
      group: aeterna-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-release-${{ github.sha }}
          path: release-bundle
      - name: Upload and activate release
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z][a-z0-9-]+$ ]]
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          key_file="$RUNNER_TEMP/aeterna_deploy_key"
          hosts_file="$RUNNER_TEMP/aeterna_known_hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          ssh_options=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts_file"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          incoming="/srv/aeterna-control-plane/incoming/$RELEASE_SHA"
          ssh "${ssh_options[@]}" "$target" "mkdir -p '$incoming'"
          scp "${ssh_options[@]}" release-bundle/images.tar.gz \
            release-bundle/release.tar.gz release-bundle/checksums.txt "$target:$incoming/"
          ssh "${ssh_options[@]}" "$target" \
            "sudo -n /usr/local/sbin/aeterna-release '$RELEASE_SHA'"
      - name: Verify public HTTPS endpoints
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://api.aeternarelay.com/api/v1/config/health > /dev/null
          curl --fail --silent --show-error --max-time 30 \
            https://console.aeternarelay.com/health > /dev/null
          curl --fail --silent --show-error --max-time 30 \
            https://claim.aeternarelay.com/health > /dev/null
