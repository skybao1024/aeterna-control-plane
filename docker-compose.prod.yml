x-kms-environment: &kms-environment
  AETERNA_KMS_ALLOW_SHARED_KEY: ${AETERNA_KMS_ALLOW_SHARED_KEY:-false}
  AETERNA_RECOVERY_KMS_KEY_ARN: ${AETERNA_RECOVERY_KMS_KEY_ARN:-}

services:
  backend:
    environment:
      <<: *kms-environment
      ENV: production
      FRONTEND_URL: ${AETERNA_PUBLIC_FRONTEND_URL:-https://claim.aeternarelay.com}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8001}:${API_PORT:-8001}"

  celery-worker:
    environment:
      <<: *kms-environment
      ENV: production
      FRONTEND_URL: ${AETERNA_PUBLIC_FRONTEND_URL:-https://claim.aeternarelay.com}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

  celery-beat:
    environment:
      <<: *kms-environment
      ENV: production
      FRONTEND_URL: ${AETERNA_PUBLIC_FRONTEND_URL:-https://claim.aeternarelay.com}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

  frontend:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"

  flower:
    environment:
      <<: *kms-environment
      ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
