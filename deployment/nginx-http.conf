# Temporary ACME ingress; replace with nginx.conf after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name api.aeternarelay.com console.aeternarelay.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aeterna-control-acme;
        default_type text/plain;
    }
    location / {
        return 503;
    }
}
