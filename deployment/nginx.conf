server {
    listen 80;
    listen [::]:80;
    server_name api.aeternarelay.com console.aeternarelay.com claim.aeternarelay.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aeterna-control-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aeternarelay.com;
    ssl_certificate /etc/letsencrypt/live/aeterna-control-plane/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aeterna-control-plane/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace client-supplied forwarding headers at the trusted edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name console.aeternarelay.com;
    ssl_certificate /etc/letsencrypt/live/aeterna-control-plane/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aeterna-control-plane/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Browsers preserve the original fragment when Location has no fragment.
    location ~ ^/(recovery-claim|contact-invitation)/?$ {
        return 308 https://claim.aeternarelay.com$request_uri;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name claim.aeternarelay.com;
    ssl_certificate /etc/letsencrypt/live/aeterna-control-plane/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aeterna-control-plane/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ ^/api/v1/(recovery/claim/(start|verify)|contact-invitations/respond)$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
    location /api/ {
        return 404;
    }
    location ~ ^/(login|dashboard)(/|$) {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
